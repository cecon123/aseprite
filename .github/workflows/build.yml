name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Skia
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/deps/skia
          key: skia-Windows-x64-m124-08a5439a6b

      - name: Download Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/deps/skia"
          curl -L --retry 3 -o skia.zip "https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip"
          unzip -q skia.zip -d "${RUNNER_TEMP}/deps/skia"
          # zip contains skia/ top-level in some releases, flatten
          if [ -d "${RUNNER_TEMP}/deps/skia/skia" ] && [ ! -d "${RUNNER_TEMP}/deps/skia/out" ]; then
            mv "${RUNNER_TEMP}/deps/skia/skia"/* "${RUNNER_TEMP}/deps/skia/"
            rmdir "${RUNNER_TEMP}/deps/skia/skia"
          fi
          ls -R "${RUNNER_TEMP}/deps/skia" | head -30

      - name: Set Skia env
        shell: bash
        run: |
          SKIA_DIR="${RUNNER_TEMP}/deps/skia"
          LIB_DIR="${SKIA_DIR}/out/Release-x64"
          echo "SKIA_DIR=${SKIA_DIR}" >> "$GITHUB_ENV"
          echo "SKIA_LIBRARY_DIR=${LIB_DIR}" >> "$GITHUB_ENV"
          echo "SKIA_LIBRARY=${LIB_DIR}/skia.lib" >> "$GITHUB_ENV"
          ls -lh "${LIB_DIR}/skia.lib" || ls -R "${SKIA_DIR}" | head -50

      - name: Configure
        shell: bash
        run: |
          mkdir build
          cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$SKIA_DIR" \
            -DSKIA_LIBRARY_DIR="$SKIA_LIBRARY_DIR" \
            -DSKIA_LIBRARY="$SKIA_LIBRARY" \
            ..

      - name: Build
        shell: bash
        run: ninja -C build aseprite -j 2

      - name: Check binary
        shell: bash
        run: |
          ls -lh build/bin
          file build/bin/aseprite.exe || true
          ./build/bin/aseprite.exe --version || true

      - name: Package
        shell: bash
        run: |
          cd build/bin
          7z a "${{ runner.temp }}/Aseprite-Windows-x64.zip" aseprite.exe data
          ls -lh "${{ runner.temp }}/Aseprite-Windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-x64
          path: ${{ runner.temp }}/Aseprite-Windows-x64.zip
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create/update continuous release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous Build
          body: |
            Automated build from `main` @ ${{ github.sha }}
          prerelease: true
          files: artifacts/*
          generate_release_notes: false

      - name: Create tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
